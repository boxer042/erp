name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 하드 게이트 — 타입 안전성 + 디자인 하드-제로 인바리언트
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Design drift gate
        run: bash scripts/check-drift.sh

      # lint error 0 (react-hooks 정리 + 디자인 드리프트 규칙 error 승급 완료) → 차단 게이트.
      - name: Lint
        run: npm run lint
